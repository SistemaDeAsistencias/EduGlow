<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesion — EduGlow</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-pagina="login">

<header class="encabezado">
  <div class="contenedor">
    <a href="index.html" class="marca"><span class="punto-glow"></span> EduGlow</a>
    <button class="nav-toggle" aria-label="Abrir menu">☰</button>
    <nav class="nav-principal">
      <a href="index.html" data-pagina="inicio">Inicio</a>
      <a href="explorar.html" data-pagina="explorar">Mentores</a>
      <a href="index.html#rutas">Rutas</a>
    </nav>
    <div class="nav-acciones" data-zona-auth></div>
  </div>
</header>

<main>
  <section class="tarjeta tarjeta-formulario">
    <h2>Inicia sesion</h2>
    <p style="margin-bottom:1.5rem;">Continua tu camino de aprendizaje en EduGlow.</p>

    <div class="mensaje-formulario" id="mensaje-login"></div>

    <form id="form-login" novalidate>
      <div class="campo">
        <label for="email">Correo electronico</label>
        <input type="email" id="email" name="email" required autocomplete="email">
      </div>
      <div class="campo">
        <label for="password">Contrasena</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="boton boton-glow boton-ancho" id="boton-login">Iniciar sesion</button>
    </form>

    <p class="enlace-secundario">¿Aun no tienes cuenta? <a href="registro.html">Registrate aqui</a></p>
  </section>
</main>

<script src="js/db-local.js"></script>
<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
