<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi perfil — EduGlow</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-pagina="perfil">

<header class="encabezado">
  <div class="contenedor">
    <a href="index.html" class="marca"><span class="punto-glow"></span> EduGlow</a>
    <button class="nav-toggle" aria-label="Abrir menu">☰</button>
    <nav class="nav-principal"></nav>
    <div class="nav-acciones" data-zona-auth></div>
  </div>
</header>

<div class="app-shell">
  <aside class="barra-lateral">
    <a href="dashboard.html" data-pagina="dashboard">🏠 Panel</a>
    <a href="explorar.html" data-pagina="explorar">🔍 Explorar mentores</a>
    <a href="reservas.html" data-pagina="reservas">📅 Mis reservas</a>
    <a href="perfil.html" data-pagina="perfil">👤 Mi perfil</a>
    <a href="admin.html" data-pagina="admin" id="enlace-admin" class="oculto">🛠️ Panel admin</a>
    <a href="#" data-accion="cerrar-sesion">🚪 Cerrar sesion</a>
  </aside>

  <main class="contenido-app">
    <div class="encabezado-pagina">
      <div>
        <h2>Mi perfil</h2>
        <p class="saludo">Administra tu informacion personal y revisa tu avance.</p>
      </div>
    </div>

    <div class="rejilla" style="grid-template-columns: 1fr 1fr; gap: 1.5rem;">
      <div class="widget">
        <div class="widget-titulo"><h3>Datos personales</h3></div>
        <div class="mensaje-formulario" id="mensaje-perfil"></div>
        <form id="form-perfil">
          <div class="campo-fila">
            <div class="campo">
              <label for="nombre">Nombre</label>
              <input type="text" id="nombre" required>
            </div>
            <div class="campo">
              <label for="apellido">Apellido</label>
              <input type="text" id="apellido" required>
            </div>
          </div>
          <div class="campo">
            <label for="email">Correo electronico</label>
            <input type="email" id="email" disabled>
          </div>
          <div class="campo">
            <label for="rol">Rol</label>
            <input type="text" id="rol" disabled>
          </div>
          <button type="submit" class="boton boton-glow">Guardar cambios</button>
        </form>
      </div>

      <div class="widget">
        <div class="widget-titulo"><h3>Cambiar contrasena</h3></div>
        <div class="mensaje-formulario" id="mensaje-password"></div>
        <form id="form-password">
          <div class="campo">
            <label for="passwordActual">Contrasena actual</label>
            <input type="password" id="passwordActual" required>
          </div>
          <div class="campo">
            <label for="passwordNueva">Nueva contrasena (minimo 8 caracteres)</label>
            <input type="password" id="passwordNueva" minlength="8" required>
          </div>
          <button type="submit" class="boton boton-linea">Actualizar contrasena</button>
        </form>
      </div>
    </div>

    <div class="widget mt-2">
      <div class="widget-titulo"><h3>Mi progreso en rutas</h3></div>
      <div id="lista-progreso-perfil"><div class="cargando">Cargando...</div></div>
    </div>

    <div class="widget mt-2">
      <div class="widget-titulo"><h3>Logros y credenciales</h3></div>
      <div id="lista-credenciales"><div class="cargando">Cargando...</div></div>
    </div>
  </main>
</div>

<script src="js/db-local.js"></script>
<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script src="js/perfil.js"></script>
</body>
</html>
