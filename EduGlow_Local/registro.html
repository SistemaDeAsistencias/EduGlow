<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crear cuenta — EduGlow</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-pagina="registro">

<header class="encabezado">
  <div class="contenedor">
    <a href="index.html" class="marca"><span class="punto-glow"></span> EduGlow</a>
    <button class="nav-toggle" aria-label="Abrir menu">☰</button>
    <nav class="nav-principal">
      <a href="index.html" data-pagina="inicio">Inicio</a>
      <a href="explorar.html" data-pagina="explorar">Mentores</a>
      <a href="index.html#rutas">Rutas</a>
    </nav>
    <div class="nav-acciones" data-zona-auth></div>
  </div>
</header>

<main>
  <section class="tarjeta tarjeta-formulario">
    <h2>Crea tu cuenta</h2>
    <p style="margin-bottom:1.5rem;">Empieza a explorar mentores y rutas de aprendizaje.</p>

    <div class="mensaje-formulario" id="mensaje-registro"></div>

    <form id="form-registro" novalidate>
      <div class="campo-fila">
        <div class="campo">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" name="nombre" required autocomplete="given-name">
        </div>
        <div class="campo">
          <label for="apellido">Apellido</label>
          <input type="text" id="apellido" name="apellido" required autocomplete="family-name">
        </div>
      </div>
      <div class="campo">
        <label for="email">Correo electronico</label>
        <input type="email" id="email" name="email" required autocomplete="email">
      </div>
      <div class="campo">
        <label for="password">Contrasena</label>
        <input type="password" id="password" name="password" required minlength="8" autocomplete="new-password">
      </div>
      <div class="campo">
        <label for="confirmarPassword">Confirmar contrasena</label>
        <input type="password" id="confirmarPassword" name="confirmarPassword" required minlength="8" autocomplete="new-password">
      </div>
      <button type="submit" class="boton boton-glow boton-ancho" id="boton-registro">Crear cuenta</button>
    </form>

    <p class="enlace-secundario">¿Ya tienes cuenta? <a href="login.html">Inicia sesion</a></p>
  </section>
</main>

<script src="js/db-local.js"></script>
<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
